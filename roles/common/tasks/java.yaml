- name: enable maven 3.9
  command: dnf module enable maven:3.9 -y

- name: install maven and java 25
  dnf:
    name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25 # installing this so that we no need to set JAVA_HOME again
      - mysql
    state: present

- name: build {{ component }}
  command: mvn clean package
  args:
    chdir: /app

- name: moving {{ component }} jar file
  command: mv target/{{ component }}.jar {{ component }}.jar
  args:
    chdir: /app